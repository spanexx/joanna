<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Joanna Obrębska · L&D Partner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta
      http-equiv="refresh"
      content="0; url=/joanna/"
    />
    <link rel="canonical" href="/joanna/" />
    <link rel="icon" href="/joanna/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!--
      GitHub Pages serves this for any path it cannot resolve (e.g. /blog,
      /oferta/lider-w-zmianie). Pages does not rewrite to index.html, so we
      bounce to the root and let the Angular router resolve the path from
      location.pathname instead.
    -->
    <p>Przekierowanie… <a href="/joanna/">Wróć na stronę główną</a></p>
    <script>
      // Preserve deep links: stash the path, then land on the app root.
      var BASE = '/joanna/';
      var full = window.location.pathname + window.location.search;
      var p = full.indexOf(BASE) === 0 ? '/' + full.slice(BASE.length) : full;
      if (p && p !== '/' && p.indexOf('/joanna') !== 0) {
        try {
          sessionStorage.setItem('jo:redirect', p);
        } catch (e) {}
      }
      window.location.replace('/joanna/');
    </script>
  </body>
</html>
